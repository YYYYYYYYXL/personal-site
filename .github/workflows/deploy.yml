name: Deploy personal site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-site-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      STAGING_DIR: /tmp/personal-site-deploy-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          package-manager-cache: false

      - name: Install V2 dependencies
        working-directory: v2
        run: npm ci --no-audit --no-fund

      - name: Check and build V2
        working-directory: v2
        run: |
          npm run check
          npm run build
          node scripts/codex_check-build.mjs

      - name: Setup SSH key
        env:
          DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/personal_site_deploy
          chmod 600 ~/.ssh/personal_site_deploy
          ssh-keyscan -p 60000 -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -p 60000 -i ~/.ssh/personal_site_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "command -v rsync && command -v curl && test -d /var/www/personal-site && test ! -L /var/www/personal-site"

      - name: Upload files to temporary directory
        run: |
          ssh -p 60000 -i ~/.ssh/personal_site_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" "mkdir -p '$STAGING_DIR'"

          rsync -avz \
            -e "ssh -p 60000 -i ~/.ssh/personal_site_deploy -o IdentitiesOnly=yes" \
            v2/dist/ "$SERVER_USER@$SERVER_HOST:$STAGING_DIR/"

      - name: Publish to Nginx directory
        run: |
          ssh -p 60000 -i ~/.ssh/personal_site_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" "bash -s -- '$STAGING_DIR'" \
            < .github/scripts/publish-static.sh

      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/personal_site_deploy
